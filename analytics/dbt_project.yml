name: jobagent
version: "1.0.0"
config-version: 2
profile: jobagent

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, logs]

models:
  jobagent:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  llm_match_threshold: 59     # same as DEFAULT_MIN_SCORE in jobagent/db.py
  ml_keep_threshold: 0.5      # a job the relevance model would keep (send to the LLM) when ml_score >= this
  ml_min_agreement: 0.7       # warn when the model and the LLM agree on fewer jobs than this in a week
  ml_min_jobs_per_week: 5     # ... and only for weeks with at least this many jobs both scored

tests:
  jobagent:
    +severity: error
