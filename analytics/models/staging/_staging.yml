version: 2

models:
  - name: stg_jobs
    description: Jobs, cleaned and renamed. Grain = one job.
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: company
        data_tests: [not_null]
      - name: source_type
        data_tests:
          - accepted_values:
              arguments:
                values: [adam, topmatch, comeet, greenhouse, workday, lever, oracle, hunter, custom]
      - name: first_seen_at
        data_tests: [not_null]
      - name: match_score
        description: 0-100 from the LLM. Personal, so it stays in the local/cached DB only.
      - name: scoring_prompt_version
        description: Prompt file (jobagent/prompts/<version>.txt) that produced match_score. NULL for scores saved before it was tracked.
      - name: scoring_model
        description: Claude model that produced match_score. NULL for scores saved before it was tracked.
      - name: ml_score
        description: >
          Relevance model P(fit or maybe), shadow mode: orders the LLM queue, never filters. Frozen once the
          LLM scores the job, so it is the model's guess before the LLM saw the job.
      - name: ml_scored_at
        description: When the relevance model last scored the job (the run that set ml_score).

  - name: stg_runs
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: started_at
        data_tests: [not_null]

  - name: stg_job_observations
    description: Grain = one job in one run.
    data_tests:
      - unique_combination:
          arguments:
            columns: [run_id, job_id]
    columns:
      - name: job_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: job_id
      - name: run_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_runs')
                field: run_id

  - name: stg_source_runs
    description: Grain = one source in one run.
    data_tests:
      - unique_combination:
          arguments:
            columns: [run_id, company, source_type]
    columns:
      - name: n_jobs
        data_tests: [not_null]

  - name: stg_job_feedback
    description: The owner's decision per job, the label for the relevance model. Grain = one job.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: job_id
              config:
                severity: warn  # feedback can arrive (via the synced file) for a job this DB never saw
      - name: decision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [applied, skipped, irrelevant]
      - name: feedback_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cli, eval]
      - name: decided_at
        data_tests: [not_null]
