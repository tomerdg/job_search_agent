name: daily-job-search

# Personal data stays out of the repo:
#   CV          -> secret CV_TEXT
#   preferences -> secret PROFILE_YAML (full contents of config/profile.yaml)
#   jobs.duckdb -> Actions cache (not committed); the digest goes to Telegram/email, never to the log.
#   dbt marts   -> built into data/warehouse.duckdb on the runner and thrown away; only pass/warn
#                  counts reach the log, never rows.

on:
  schedule:
    - cron: "0 8 * * 0,2,4"   # 07:00/08:00 Israel time, Sunday-Thursday
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "jobagent/**"
      - "tests/**"
      - "analytics/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "pytest.ini"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "jobagent/**"
      - "tests/**"
      - "analytics/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "pytest.ini"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: daily-job-search-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dbt.txt
      - run: pytest -q

      # dbt models + tests against a synthetic DB (made-up companies and jobs, no real data).
      - name: dbt build on demo data
        env:
          DBT_RAW_DB: data/demo.duckdb
          DBT_WAREHOUSE_DB: data/demo_warehouse.duckdb
        run: |
          python -m jobagent.demo --db data/demo.duckdb
          dbt build --project-dir analytics --profiles-dir analytics

  run:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore jobs.duckdb
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.duckdb
          key: jobs-duckdb-${{ github.run_id }}
          restore-keys: jobs-duckdb-

      # One-time migration: before DuckDB the cache held a SQLite jobs.db. The agent imports it.
      - name: Restore old SQLite jobs.db
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Build image
        run: docker build -t job-search-agent .

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p data
          docker run --rm \
            -e ANTHROPIC_API_KEY -e PROFILE_YAML -e CV_TEXT \
            -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID \
            -e SMTP_HOST -e SMTP_USER -e SMTP_PASSWORD -e EMAIL_TO \
            -e JOBS_DB=/app/data/jobs.duckdb \
            -v "$PWD/data:/app/data" \
            job-search-agent

      - name: Save jobs.duckdb
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.duckdb
          key: jobs-duckdb-${{ github.run_id }}

      # Build the marts from the real history and run the data tests (incl. the source-down warning).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: dbt build
        env:
          DBT_RAW_DB: data/jobs.duckdb
          DBT_WAREHOUSE_DB: data/warehouse.duckdb
        run: |
          pip install -r requirements-dbt.txt
          dbt build --project-dir analytics --profiles-dir analytics
