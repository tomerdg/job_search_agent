name: daily-job-search

# Personal data stays out of the repo:
#   CV          -> secret CV_TEXT
#   preferences -> secret PROFILE_YAML (full contents of config/profile.yaml)
#   jobs.duckdb -> encrypted with secret DB_PASSPHRASE, then kept in the Actions cache between runs
#                  (never committed). The digest goes to Telegram/email, never to the log.
#   download    -> after each run, jobs.duckdb + warehouse.duckdb are uploaded as the artifact
#                  "job-db", encrypted with the same passphrase. The repo is public and any signed-in
#                  GitHub user can download its artifacts, so they are never uploaded unencrypted.
#   dbt marts   -> only pass/warn counts reach the log, never rows.

on:
  schedule:
    # Cron is UTC: 08:23 UTC = 10:23 Israel (winter) / 11:23 (summer), Sun/Tue/Thu.
    # Off the top of the hour, when GitHub most often delays or drops scheduled runs.
    - cron: "23 8 * * 0,2,4"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "jobagent/**"
      - "tests/**"
      - "analytics/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "pytest.ini"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "jobagent/**"
      - "tests/**"
      - "analytics/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "pytest.ini"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: daily-job-search-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dbt.txt
      - run: pytest -q

      # dbt models + tests against a synthetic DB (made-up companies and jobs, no real data).
      - name: dbt build on demo data
        env:
          DBT_RAW_DB: data/demo.duckdb
          DBT_WAREHOUSE_DB: data/demo_warehouse.duckdb
        run: |
          python -m jobagent.demo --db data/demo.duckdb
          dbt build --project-dir analytics --profiles-dir analytics

  run:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_DB_KEY: ${{ secrets.DB_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4

      # Preferred: the encrypted DB from the last run.
      - name: Restore encrypted jobs.duckdb
        id: enc_cache
        if: env.HAS_DB_KEY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.duckdb.enc
          key: jobs-duckdb-enc-${{ github.run_id }}
          restore-keys: jobs-duckdb-enc-

      - name: Decrypt jobs.duckdb
        if: steps.enc_cache.outputs.cache-matched-key != ''
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: |
          scripts/dbcrypt.sh decrypt data/jobs.duckdb.enc data/jobs.duckdb
          rm data/jobs.duckdb.enc

      # Fallback / one-time migration: the unencrypted cache from before DB_PASSPHRASE existed.
      - name: Restore unencrypted jobs.duckdb
        id: cache
        if: steps.enc_cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.duckdb
          key: jobs-duckdb-${{ github.run_id }}
          restore-keys: jobs-duckdb-

      # One-time migration: before DuckDB the cache held a SQLite jobs.db. The agent imports it.
      - name: Restore old SQLite jobs.db
        if: steps.enc_cache.outputs.cache-matched-key == '' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Build image
        run: docker build -t job-search-agent .

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p data
          docker run --rm \
            -e ANTHROPIC_API_KEY -e PROFILE_YAML -e CV_TEXT \
            -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID \
            -e SMTP_HOST -e SMTP_USER -e SMTP_PASSWORD -e EMAIL_TO \
            -e JOBS_DB=/app/data/jobs.duckdb \
            -v "$PWD/data:/app/data" \
            job-search-agent

      - name: Encrypt and save jobs.duckdb
        if: always() && env.HAS_DB_KEY == 'true' && hashFiles('data/jobs.duckdb') != ''
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: scripts/dbcrypt.sh encrypt data/jobs.duckdb data/jobs.duckdb.enc

      - name: Save encrypted jobs.duckdb
        if: always() && env.HAS_DB_KEY == 'true' && hashFiles('data/jobs.duckdb.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data/jobs.duckdb.enc
          key: jobs-duckdb-enc-${{ github.run_id }}

      # Without DB_PASSPHRASE: keep the old behaviour so history is not lost, and say so.
      - name: Save unencrypted jobs.duckdb
        if: always() && env.HAS_DB_KEY != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/jobs.duckdb
          key: jobs-duckdb-${{ github.run_id }}

      # Build the marts from the real history and run the data tests (incl. the source-down warning).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: dbt build
        env:
          DBT_RAW_DB: data/jobs.duckdb
          DBT_WAREHOUSE_DB: data/warehouse.duckdb
        run: |
          pip install -r requirements-dbt.txt
          dbt build --project-dir analytics --profiles-dir analytics

      # Downloadable copy for querying locally (see README, "Query your job history").
      - name: Encrypt databases for download
        if: always() && env.HAS_DB_KEY == 'true' && hashFiles('data/jobs.duckdb') != ''
        env:
          DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
        run: |
          files=(jobs.duckdb)
          [ -f data/warehouse.duckdb ] && files+=(warehouse.duckdb)
          tar -czf job-db.tar.gz -C data "${files[@]}"
          scripts/dbcrypt.sh encrypt job-db.tar.gz job-db.tar.gz.enc
          rm job-db.tar.gz

      - name: Upload encrypted databases
        if: always() && env.HAS_DB_KEY == 'true' && hashFiles('job-db.tar.gz.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-db
          path: job-db.tar.gz.enc
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Warn when DB_PASSPHRASE is missing
        if: always() && env.HAS_DB_KEY != 'true'
        run: echo "::warning::Secret DB_PASSPHRASE is not set, so the job database is cached unencrypted and no downloadable copy is made. Add the secret to fix both."
